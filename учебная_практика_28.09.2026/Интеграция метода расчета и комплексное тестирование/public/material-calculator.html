<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CRM: Расчет материалов</title>

  <link
    rel="icon"
    type="image/png"
    href="./resources/app-icon.png"
  >

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body>
  <main class="crm">
    <header class="crm__header">
      <img
        class="crm__logo"
        src="./resources/logo.png"
        alt="Логотип компании"
      >

      <div class="crm__heading">
        <h1 class="crm__title">
          Расчет материалов
        </h1>

        <p class="crm__subtitle">
          Расчет необходимого количества сырья для производства
        </p>
      </div>
    </header>

    <section class="material-calculator">
      <form
        id="material-form"
        class="partner-form"
      >
        <div class="form-field">
          <label for="product-type-id">
            ID типа продукции
          </label>

          <input
            id="product-type-id"
            type="number"
            step="1"
            placeholder="Например, 1"
          >

          <span class="form-hint">
            Доступные ID: 1, 2, 3
          </span>
        </div>

        <div class="form-field">
          <label for="material-type-id">
            ID типа материала
          </label>

          <input
            id="material-type-id"
            type="number"
            step="1"
            placeholder="Например, 1"
          >

          <span class="form-hint">
            Доступные ID: 1, 2, 3
          </span>
        </div>

        <div class="form-field">
          <label for="quantity">
            Количество продукции
          </label>

          <input
            id="quantity"
            type="number"
            step="1"
            placeholder="Например, 10"
          >
        </div>

        <div class="form-field">
          <label for="param-1">
            Параметр 1
          </label>

          <input
            id="param-1"
            type="number"
            step="any"
            placeholder="Например, 2.5"
          >
        </div>

        <div class="form-field">
          <label for="param-2">
            Параметр 2
          </label>

          <input
            id="param-2"
            type="number"
            step="any"
            placeholder="Например, 4"
          >
        </div>

        <div class="form-field--full">
          <div
            id="calculation-result"
            class="calculation-result"
            hidden
          ></div>
        </div>

        <div class="partner-edit__actions form-field--full">
          <button
            id="back-button"
            class="button button--secondary"
            type="button"
          >
            Назад
          </button>

          <button
            class="button button--primary"
            type="submit"
          >
            Рассчитать
          </button>
        </div>
      </form>
    </section>
  </main>

  <script
    type="module"
    src="./material-calculator.js"
  ></script>
</body>
</html>
