<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CRM: Реестр партнеров</title>

  <link
    rel="icon"
    type="image/png"
    href="./resources/app-icon.png"
  >

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body>
  <main class="crm">
    <header class="crm__header">
      <img
        class="crm__logo"
        src="./resources/logo.png"
        alt="Логотип компании"
      >

      <div class="crm__heading">
        <h1 class="crm__title">
          CRM: Реестр партнеров
        </h1>

        <p class="crm__subtitle">
          Список партнеров и текущих скидок
        </p>
      </div>

      <button
        id="add-partner-button"
        class="button button--primary"
        type="button"
      >
        + Добавить партнера
      </button>
    </header>

    <section
      id="partners-list"
      class="partners-list"
    >
    </section>
  </main>

  <script
    type="module"
    src="./main.js"
  ></script>
</body>
</html>
